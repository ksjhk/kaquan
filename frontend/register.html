<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>注册开放平台账号-卡世界开放平台</title>
<meta name="description" content="注册卡世界开放平台账号，免费接入 200+ 卡券货源 API，底价供货、自动发货。开放平台账号与官网商城账号相互独立。" />
<link rel="icon" href="../assets/logo-icon.png" />
<link rel="stylesheet" href="open-common.css" />
<style>
  .auth-wrap { min-height: calc(100vh - 64px); background: linear-gradient(217deg, #9baffe, #9cc6ff 20%, #bed4ff 47%, #ace1ff 71%, #fff 99%); padding: 60px 0 100px; }
  .auth-card { width: 440px; margin: 0 auto; background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(22,93,255,.12); padding: 44px 44px 36px; }
  .auth-logo { display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .auth-logo img { height: 40px; margin-right: 10px; }
  .auth-logo span { font-size: 22px; font-weight: 700; color: #2f6bff; }
  .auth-title { text-align: center; font-size: 18px; font-weight: 700; margin-top: 14px; }
  .auth-sub { text-align: center; font-size: 12px; color: #86909c; margin-top: 8px; line-height: 20px; }
  .auth-form { margin-top: 28px; }
  .form-item { margin-bottom: 18px; }
  .form-item label { display: block; font-size: 13px; font-weight: 700; color: #1d1d1f; margin-bottom: 8px; }
  .form-item label .opt { font-weight: 400; color: #a9aeb8; font-size: 12px; }
  .form-item input { width: 100%; height: 46px; border: 1px solid #e5e6eb; border-radius: 10px; padding: 0 14px; font-size: 14px; outline: none; transition: border-color .2s; }
  .form-item input:focus { border-color: #165dff; }
  .sms-row { display: flex; gap: 10px; }
  .sms-row input { flex: 1; }
  .sms-btn { flex: none; width: 120px; height: 46px; border-radius: 10px; border: 1px solid #165dff; background: #fff; color: #165dff; font-size: 13px; cursor: pointer; transition: all .2s; }
  .sms-btn:hover:not([disabled]) { background: #eaf1ff; }
  .sms-btn[disabled] { opacity: .5; cursor: not-allowed; }
  .auth-submit { width: 100%; height: 48px; border-radius: 12px; border: none; background: #165dff; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: background .2s; margin-top: 6px; }
  .auth-submit:hover:not([disabled]) { background: #3370ff; }
  .auth-submit[disabled] { opacity: .6; cursor: not-allowed; }
  .auth-foot { text-align: center; font-size: 13px; color: #86909c; margin-top: 22px; }
  .auth-foot a { color: #165dff; }
  @media (max-width: 520px) { .auth-card { width: 92%; padding: 32px 22px; } }
</style>
</head>
<body>
<div id="op-header-mount"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><img src="../assets/logo-icon.png" alt="卡世界" /><span>卡世界</span></div>
    <div class="auth-title">注册开放平台账号</div>
    <div class="auth-sub">开放平台账号与官网商城账号相互独立<br />注册即可创建 API 密钥，接入 200+ 卡券货源</div>
    <form class="auth-form" id="reg-form" autocomplete="off">
      <div class="form-item">
        <label>手机号</label>
        <input type="tel" id="mobile" maxlength="11" placeholder="请输入 11 位手机号" />
      </div>
      <div class="form-item">
        <label>验证码</label>
        <div class="sms-row">
          <input type="text" id="code" maxlength="6" placeholder="短信验证码" />
          <button type="button" class="sms-btn" id="sms-btn">获取验证码</button>
        </div>
      </div>
      <div class="form-item">
        <label>密码</label>
        <input type="password" id="password" maxlength="32" placeholder="请设置登录密码（至少 6 位）" />
      </div>
      <button type="submit" class="auth-submit" id="submit-btn">注册并登录</button>
    </form>
    <div class="auth-foot">已有开放平台账号？<a href="login.html">直接登录</a></div>
  </div>
</div>

<div id="op-footer-mount"></div>

<script src="open-common.js"></script>
<script>
  OP.renderHeader();
  OP.renderFooter();

  if (OP.getToken()) { location.href = 'console.html'; }

  /* 静默接收邀请参数：URL ?invite=xxx 有则注册时一并提交，页面无任何展示 */
  var inviteCode = OP.getQuery('invite') || '';

  var smsBtn = document.getElementById('sms-btn');
  var mobileInput = document.getElementById('mobile');

  function validMobile() {
    var m = mobileInput.value.trim();
    if (!/^1\d{10}$/.test(m)) { OP.toast('请输入正确的 11 位手机号'); return null; }
    return m;
  }

  smsBtn.addEventListener('click', function () {
    var m = validMobile();
    if (!m) return;
    smsBtn.disabled = true;
    smsBtn.textContent = '发送中...';
    OP.openApi('/sms', { method: 'POST', data: { mobile: m } })
      .then(function (data) {
        if (data && data.debug_code) {
          document.getElementById('code').value = data.debug_code;
          OP.toast('调试模式：未配置短信服务，验证码已自动填入');
        } else {
          OP.toast('验证码已发送，请注意查收');
        }
        countdown(60);
      })
      .catch(function (err) {
        OP.toast(err.message || '验证码发送失败');
        smsBtn.disabled = false;
        smsBtn.textContent = '获取验证码';
      });
  });

  function countdown(s) {
    smsBtn.disabled = true;
    smsBtn.textContent = s + 's 后重发';
    var t = setInterval(function () {
      s--;
      if (s <= 0) {
        clearInterval(t);
        smsBtn.disabled = false;
        smsBtn.textContent = '获取验证码';
      } else {
        smsBtn.textContent = s + 's 后重发';
      }
    }, 1000);
  }

  document.getElementById('reg-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var m = validMobile();
    if (!m) return;
    var code = document.getElementById('code').value.trim();
    var pwd = document.getElementById('password').value;
    if (!code) { OP.toast('请输入验证码'); return; }
    if (pwd.length < 6) { OP.toast('密码至少 6 位'); return; }

    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '注册中...';
    OP.openApi('/register', {
      method: 'POST',
      data: { mobile: m, code: code, password: pwd, invite_code: inviteCode || undefined }
    }).then(function (d) {
      if (d && d.token) {
        OP.setToken(d.token);
        OP.toast('注册成功，正在进入控制台...');
        setTimeout(function () { location.href = 'console.html'; }, 800);
      } else {
        OP.toast('注册成功，请登录');
        setTimeout(function () { location.href = 'login.html'; }, 800);
      }
    }).catch(function (err) {
      OP.toast(err.message || '注册失败，请稍后再试');
      btn.disabled = false;
      btn.textContent = '注册并登录';
    });
  });
</script>
</body>
</html>
